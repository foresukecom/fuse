<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            height: 200px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h1 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #45a049;
        }
        input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .status {
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-group label {
            min-width: 30px;
            font-weight: bold;
        }
        .input-group input {
            flex: 1;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>fuse ⏰</h1>
        <div class="input-group">
            <label for="themeSelect">テーマ:</label>
            <select id="themeSelect">
                <option value="bomb">💣 爆弾</option>
                <option value="dog">🐕 犬と家</option>
                <option value="ship">⛵ 船と島</option>
            </select>
        </div>
        <div class="input-group">
            <label for="timeInput">時間:</label>
            <input type="time" id="timeInput" value="00:05" step="1">
        </div>
        <button id="startTimer">タイマー開始</button>
        <button id="stopTimer" disabled>タイマー停止</button>
        <div class="status" id="status">タイマーを設定してください</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
