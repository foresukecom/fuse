<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  /* ストア用スクリーンショットで、fuse を表示する「スライド」。下 100px は導火線の表示領域として空けておく */
  :root {
    --paper: #f4f1ea;
    --ink: #232838;
    --muted: #5b6170;
    --fuse: #d9a764;
    --flame: #ff7a1a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
    padding: 84px 96px 120px;
    display: flex;
    gap: 56px;
    align-items: center;
  }
  .text { flex: 1; min-width: 0; }
  .eyebrow {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--flame);
  }
  h1 {
    margin-top: 18px;
    font-size: 56px;
    line-height: 1.3;
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  p {
    margin-top: 28px;
    font-size: 24px;
    line-height: 1.8;
    color: var(--muted);
  }
  .rule {
    margin-top: 40px;
    width: 120px;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--ink) 45%, var(--fuse) 45%);
  }
  .aside { flex: none; }
  .aside img {
    display: block;
    border-radius: 14px;
    box-shadow: 0 18px 48px rgba(35, 40, 56, 0.22);
  }
  .page {
    position: fixed;
    right: 40px;
    top: 32px;
    font-size: 16px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="page">{{page}}</div>
  <div class="text">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{title}}</h1>
    <p>{{body}}</p>
    <div class="rule"></div>
  </div>
  {{aside}}
</body>
</html>
